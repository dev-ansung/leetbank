name: Sync Data & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run weekly every Monday at 04:00 UTC to keep company questions fresh
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚡ Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔄 Sync Company Datasets & Refresh Fetch Date
        run: |
          python3 scripts/sync-companies.py

      - name: 📦 Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: 🧪 Run Automated Tests
        run: |
          bun test

      - name: 🏗️ Build Edge SSR Application
        run: |
          bun run build

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6a61ba2ae8edd10e314785eb1f7734a9' }}
          command: pages deploy dist --project-name=leetbank --commit-dirty=true
